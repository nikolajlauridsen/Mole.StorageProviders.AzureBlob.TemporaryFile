name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for NuGet trusted publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      
      - name: Pack
        run: |
          dotnet pack Mole.StorageProviders.AzureBlob.TemporaryFile/Mole.StorageProviders.AzureBlob.TemporaryFile.csproj -c Release -o Build.Out

      - name: NuGet login (OIDC → short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Mole4 # nuget.org profile name (public: the package owner)
      
      - name: Publish NuGet package
        run: dotnet nuget push Build.Out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
